name: lote-production
x-app: &app
  build: .
  env_file: .env.production
  environment:
    NODE_ENV: production
    DATABASE_URL: ${DATABASE_URL:?Configure database URL using host db}
    STORAGE_DIR: /app/.runtime/uploads
  volumes:
    - uploads:/app/.runtime/uploads
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: lote
      POSTGRES_DB: lote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure database password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lote -d lote"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["npm", "run", "migrate"]
    restart: "no"
  app:
    <<: *app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: ["npm", "run", "worker"]
  proxy:
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Configure domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  uploads:
  caddydata:
  caddyconfig:
