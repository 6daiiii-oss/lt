name: Verify marketplace
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lote
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: lote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lote -d lote"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lote:test-only-password@127.0.0.1:5432/lote
      SESSION_SECRET: ci-test-only-session-secret-minimum-32-chars
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SANDBOX_WEBHOOK_SECRET: ci-test-only-webhook-secret-minimum-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
